runtime:
  mode: once

logging:
  level: DEBUG
  persist:
    signals: true
    indicators: true
    orders: true
    fills: true
    positions: true

strategy:
  id: trend_following
  timeframe: 1Min
  trend_following:
    target_qty_when_long: 1.0
    ema_fast_period: 12
    ema_slow_period: 26
    macd_fast_period: 12
    macd_slow_period: 26
    macd_signal_period: 9
    fixed_stop_loss_pct: 0.03
  mean_reversion:
    target_qty_when_long: 1.0
    rsi_period: 14
    oversold: 30
    exit_rsi: 50
    mean_period: 20
    stretch_pct: 0.02
    fixed_stop_loss_pct: 0.03
  bollinger_band:
    target_qty_when_long: 1.0
    period: 20
    stddev_multiplier: 2.0
    trailing_stop_pct: 0.05

risk:
  max_orders_per_run: 10
  max_gross_usd: 250000
  max_pos_usd_per_symbol: 100000
  max_open_buy_orders_per_symbol: 1

broker:
  type: alpaca
  time_in_force: gtc

alpaca:
  api_key: ${ALPACA_API_KEY}
  secret_key: ${ALPACA_SECRET_KEY}
  base_url: ${ALPACA_BASE_URL}
  data_base_url: https://data.alpaca.markets

market_data:
  source: alpaca
  asset_class: crypto
  stock_feed: iex
  symbols:
    - BTC/USD
  max_age_seconds: 604800

database:
  event_store: postgres
  pg:
    host: ${PG_HOST}
    port: ${PG_PORT}
    db: ${PG_DB}
    user: ${PG_USER}
    password: ${PG_PASSWORD}
  buffering:
    enabled: false
    flush_interval_ms: 1000
    max_batch_size: 5000
    max_queue_size: 10000
    block_on_full: true

backfill:
  since: 40d
  timeframe: 1Min
  symbols:
    - BTC/USD
  asset_class: crypto
  limit: null

stream:
  symbols:
    - BTC/USD
  asset_class: crypto
  timeframe: 1Min

trader_service:
  mode: real_time
  startup_recovery_mode: resume
  cadence_seconds: 1.0
  min_trigger_interval_ms: 200
  notify_channel: market_data
  max_iterations: null
  portfolio_source: alpaca
  initial_cash: 100000
  initial_positions:
    - symbol: BTC/USD
      qty: 0

replay:
  asset_class: crypto
  symbols:
    - BTC/USD
  timeframe: 1Min
  start: "2026-01-20T00:00:00Z"
  end: "2026-01-21T00:00:00Z"
  cadence_seconds: 0.2
  notify_channel: market_data
  limit: null

metrics:
  enable_snapshots: true
  interval_seconds: 30
  window_seconds: null

backtest:
  start: "2026-01-20T00:00:00Z"
  end: "2026-01-21T00:00:00Z"
  timeframe: 1Min
  symbols:
    - BTC/USD
  asset_class: crypto
  max_runs: null
  log_cycle_details: true
  initial_cash: 1000000
  initial_positions:
    - symbol: BTC/USD
      qty: 0
