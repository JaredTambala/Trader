name: trader-console-demo
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: trader_console_demo
      POSTGRES_USER: console_demo
      POSTGRES_PASSWORD: console_demo_local
    ports:
      - "127.0.0.1:${CONSOLE_DEMO_DATABASE_PORT:-55432}:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U console_demo -d trader_console_demo"]
      interval: 1s
      timeout: 3s
      retries: 30
volumes:
  database:
