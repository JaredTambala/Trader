name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --dev --extra ml --group docs

      - name: Ruff
        run: uv run ruff check src tests examples run_*.py external_strategy_demo.py

      - name: Mypy
        run: uv run mypy

      - name: Offline tests
        run: uv run pytest -m 'not postgres'

      - name: Build distribution
        run: uv build --out-dir /tmp/trader-dist

      - name: Verify packaged documentation
        run: uv run python tests/cross_package/documentation/support/verify_wheel_documentation.py /tmp/trader-dist/*.whl

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/trader-console/.nvmrc
          cache: npm
          cache-dependency-path: apps/trader-console/package-lock.json
      - run: npm install --global npm@11.19.0
      - run: npm ci
        working-directory: apps/trader-console
      - run: npm run lint && npm run typecheck && npm test && npm run check:contracts
        working-directory: apps/trader-console
      - run: uv run python -m trader_console_api.openapi --output contracts/trader-console/openapi.json --check
      - run: npx playwright install --with-deps chromium
        working-directory: apps/trader-console
      - name: Real database and browser workflows (includes production build)
        env:
          CONSOLE_DEMO_TESTS: "1"
          CONSOLE_BROWSER_TESTS: "1"
          CONSOLE_EXECUTION_TESTS: "1"
          CONSOLE_EXECUTION_BROWSER_TESTS: "1"
        run: uv run pytest tests/cross_package/workflows/test_console_demo.py tests/cross_package/workflows/test_console_demo_postgres.py tests/cross_package/workflows/test_console_browser.py tests/cross_package/workflows/test_console_execution_to_review.py tests/cross_package/workflows/test_console_execution_to_review_browser.py -q

  uj08-qualification:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: trader
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: traderpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trader -d trader"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Create disposable UJ-08 database
        env:
          PGPASSWORD: traderpass
        run: psql --host 127.0.0.1 --port 5432 --username trader --dbname trader --command 'CREATE DATABASE trader_uj08_test'
      - name: Install dependencies
        run: uv sync --dev --extra ml --group docs
      - name: Run retained UJ-08 campaign
        env:
          UJ08_PG_HOST: 127.0.0.1
          UJ08_PG_PORT: "5432"
          UJ08_PG_DB: trader_uj08_test
          UJ08_PG_USER: trader
          UJ08_PG_PASSWORD: traderpass
          UJ08_REQUIRED: "1"
          UJ08_EVIDENCE_PATH: ${{ github.workspace }}/uj08-postgres-verifier.json
        run: uv run pytest tests/cross_package/qualification/test_uj08_postgres_campaign.py -m postgres -q
      - name: Retain UJ-08 verifier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uj08-postgres-verifier-${{ github.sha }}
          path: uj08-postgres-verifier.json*
          if-no-files-found: error
