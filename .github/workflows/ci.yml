name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: trader
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: traderpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trader -d trader"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PG_HOST: 127.0.0.1
      PG_PORT: 5432
      PG_DB: trader
      PG_USER: trader
      PG_PASSWORD: traderpass

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff
        run: uv run ruff check src tests examples run_*.py external_strategy_demo.py

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest
