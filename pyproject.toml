[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trader"
version = "0.1.0"
description = "Remote paper trading system skeleton"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
authors = [{name = "Trader"}]
dependencies = [
    "alpaca-py>=0.43.5",
    "dotenv>=0.9.9",
    "fastapi>=0.128.0",
    "langgraph>=1.2.2",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "mcp>=1.27.1,<2",
    "psycopg[binary]>=3.2.1",
    "pydantic>=2.12,<3",
    "pypdf>=6.4.0",
    "pyyaml>=6.0.2",
    "uvicorn>=0.40.0",
]

[project.urls]
Repository = "https://github.com/JaredTambala/Trader"
Documentation = "https://github.com/JaredTambala/Trader/tree/main/docs"

[project.scripts]
trader-agent = "trader_agents.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.4"]
ui = ["reflex", "plotly>=5.20.0"]
optimization = ["optuna>=4,<5"]
ml = ["mlflow>=3,<4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trader = ["README.md", "docs/*.md", "docs/*.ipynb"]
trader_standard = ["README.md", "docs/*.md", "docs/*.ipynb"]
trader_research = ["README.md", "docs/*.md", "docs/*.ipynb", "method_contracts_seed.json"]
trader_mcp = ["README.md", "docs/*.md", "docs/*.ipynb"]
trader_agents = ["README.md", "docs/*.md", "docs/*.ipynb"]
trader_mlflow = ["README.md", "docs/*.md", "docs/*.ipynb"]
"trader_standard.indicators" = ["cpp/*.cpp.template", "bindings/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "local_model: opt-in contract tests requiring the admitted local LLM",
    "postgres: integration tests requiring a live Postgres instance",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = [
    "src/trader/config/core.py",
    "src/trader/risk/context.py",
    "src/trader/risk/manager.py",
    "src/trader/risk/pipeline.py",
    "src/trader/strategies/base.py",
    "src/trader/broker/contracts.py",
    "src/trader/broker/core.py",
    "src/trader/broker/helpers.py",
    "src/trader/broker/internal.py",
    "src/trader/strategy_metadata/resolution.py",
    "src/trader_research",
    "src/trader_mcp",
    "src/trader_agents",
    "src/trader/runtime/status.py",
    "run_operator.py",
]
check_untyped_defs = true
follow_imports = "silent"
no_implicit_optional = true
pretty = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["alpaca.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "duckdb>=1.4.3",
    "httpx>=0.28.1",
    "mypy>=1.18.2",
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "ruff>=0.13.1",
    "types-pyyaml>=6.0.12.20250915",
]
docs = [
    "ipykernel>=6,<8",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
]
ui = ["reflex", "plotly>=5.20.0"]
