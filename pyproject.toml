[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trader"
version = "0.1.0"
description = "Remote paper trading system skeleton"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
authors = [{name = "Trader"}]
dependencies = [
    "alpaca-py>=0.31.0",
    "dotenv>=0.9.9",
    "fastapi>=0.128.0",
    "plotly>=6.5.2",
    "psycopg[binary]>=3.2.1",
    "pytest>=9.0.2",
    "pyyaml>=6.0.2",
    "reflex>=0.8.26",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
ui = ["reflex", "plotly>=5.20.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[dependency-groups]
dev = [
    "duckdb>=1.4.3",
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
]
ui = ["reflex", "plotly>=5.20.0"]
